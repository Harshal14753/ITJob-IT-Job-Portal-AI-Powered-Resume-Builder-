spring.datasource.url=jdbc:postgresql://localhost:5433/itjob
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SMTP password (sensitive — overridable via SMTP_PASSWORD env var)
app.smtp.password=${SMTP_PASSWORD:pppx hiri ecqw yhfd}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=itjobportaljwtsecretkeyforauthentication2026securekey

logging.level.org.springframework.security=DEBUG

# Cloudinary credentials (sensitive — overridable via env vars)
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER}

# Gemini AI API key (free tier from Google AI Studio)
gemini.api.key=${GEMINI_API_KEY}

# Multipart file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB